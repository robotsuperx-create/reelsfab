<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Iran reel</title>
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(lib/cairo-900.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Cairo;font-weight:900;src:url(lib/cairo-latin-900.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:700;src:url(lib/cairo-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Kufi;font-weight:700;src:url(lib/reemkufi-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Kufi;font-weight:700;src:url(lib/reemkufi-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#030406;font-family:Cairo,sans-serif;color:#f3f4f6}
.layer{position:absolute;inset:0}
canvas{position:absolute;left:0;top:0}
#gl{width:1080px;height:1920px}
#photo{opacity:0;overflow:hidden}
#photo img{position:absolute;left:50%;top:50%;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 42%}
#pbg{filter:grayscale(1) sepia(.55) brightness(.5) blur(7px)}
#pcut{filter:grayscale(.85) sepia(.4) contrast(1.18) brightness(.98)}
#ptint{background:radial-gradient(70% 55% at 50% 40%,rgba(212,175,55,.0),rgba(5,4,2,.75) 100%),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.85))}
.shard{position:absolute;inset:0;background-size:1080px 1920px;will-change:transform}
#rev{opacity:0;overflow:hidden}
#rev img{position:absolute;left:50%;top:50%;width:1080px;height:1920px;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(.42)}
#rev .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,0,0,.55),rgba(10,0,0,.25) 45%,rgba(0,0,0,.9));mix-blend-mode:multiply}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0;white-space:nowrap;will-change:transform,opacity,filter}
.big{font-weight:900;line-height:1.05;text-shadow:0 6px 30px rgba(0,0,0,.85),0 2px 4px rgba(0,0,0,.9)}
.gold{color:#f1cb57;text-shadow:0 0 34px rgba(212,175,55,.55),0 0 2px rgba(255,236,170,.9),0 8px 28px rgba(0,0,0,.92)}
.red{color:#ff3b30;text-shadow:0 0 40px rgba(255,40,30,.45),0 6px 26px rgba(0,0,0,.9)}
.kicker{font-family:Kufi,Cairo,sans-serif;font-weight:700;font-size:44px;letter-spacing:0;color:#d4af37}
.kicker:before,.kicker:after{content:"";display:inline-block;width:70px;height:3px;background:#d4af37;vertical-align:middle;margin:0 22px;opacity:.8}
.stamp{position:absolute;left:50%;padding:18px 54px 26px;border:9px solid #e0241b;border-radius:14px;color:#e0241b;font-weight:900;font-size:120px;line-height:1.1;opacity:0;white-space:nowrap;box-shadow:0 0 60px rgba(224,36,27,.25),inset 0 0 40px rgba(224,36,27,.18);background:rgba(20,0,0,.35)}
#flash{background:#fff;opacity:0;mix-blend-mode:screen}
#gflash{background:radial-gradient(60% 40% at 50% 47%,rgba(255,225,140,.95),rgba(212,175,55,.35) 50%,rgba(0,0,0,0) 80%);opacity:0;mix-blend-mode:screen}
#leak{background:radial-gradient(45% 30% at 85% 15%,rgba(255,170,60,.55),rgba(0,0,0,0) 70%),radial-gradient(40% 25% at 10% 90%,rgba(212,175,55,.35),rgba(0,0,0,0) 70%);mix-blend-mode:screen;opacity:.22}
#vig{background:radial-gradient(120% 75% at 50% 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.78) 100%)}
#grain{width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.2;image-rendering:pixelated}
#bars{pointer-events:none}
#strike{position:absolute;left:24%;right:24%;top:56%;height:12px;background:#ff3b30;box-shadow:0 0 24px rgba(255,59,48,.7);border-radius:6px;transform-origin:100% 50%;transform:scaleX(0)}
#tag{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-family:Kufi,Cairo,sans-serif;font-size:40px;color:rgba(243,244,246,.85);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="rev" class="layer"><img src="revolution.jpg" alt=""><div class="tint"></div></div>
  <div id="photo" class="layer"><img id="pbg" src="shah_bg.jpg" alt=""><img id="pcut" src="shah_cut.png" alt=""><div id="ptint" class="layer"></div></div>
  <div id="shards" class="layer"></div>
  <svg id="cracks" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="texts" class="layer">
    <div id="k1979" class="t kicker" style="top:1250px">طهران</div>
    <div id="y1979" class="t big gold" style="top:1320px;font-size:300px;font-family:Cairo;direction:ltr">1979</div>
    <div id="sFell" class="t big" style="top:250px;font-size:190px">سقطَ</div>
    <div id="sThrone" class="t big gold" style="top:440px;font-size:230px">عرشٌ</div>
    <div id="sMade" class="t big" style="top:1290px;font-size:96px">صنعتْه</div>
    <div id="sWash" class="t big red" style="top:1410px;font-size:170px">واشنطن</div>
    <div id="wWorld" class="t big" style="top:250px;font-size:200px">العالم</div>
    <div id="wPunish" class="t big" style="top:1420px;font-size:120px">يعاقب <span class="gold">إيران</span></div>
    <div id="n40" class="t big gold" style="top:200px;font-size:330px;direction:ltr">40</div>
    <div id="n40l" class="t kicker" style="top:600px;font-size:60px">عامًا</div>
    <div id="st1" class="stamp" style="top:820px">حصار</div>
    <div id="st2" class="stamp" style="top:1080px">عقوبات</div>
    <div id="st3" class="stamp" style="top:1340px;font-size:104px">حرب 8 سنوات</div>
    <div id="yet" class="t" style="top:420px;font-size:80px;font-weight:700;color:#cfd3da">ومع ذلك...</div>
    <div id="notBroke" class="t big gold" style="top:1330px;font-size:210px">لم تنكسر</div>
    <div id="mMade" class="t big" style="top:230px;font-size:120px">صنعتْ صواريخَها</div>
    <div id="mHands" class="t big gold" style="top:390px;font-size:190px">بيدِها</div>
    <div id="mSpace" class="t big" style="top:1460px;font-size:130px">إلى <span class="gold">الفضاء</span></div>
    <div id="fNot" class="t big" style="top:330px;font-size:92px;color:#e5e7eb">ليست قصةَ دولةٍ</div>
    <div id="fBes" class="t big" style="top:450px;font-size:150px">مُحاصَرة<div id="strike"></div></div>
    <div id="fBut" class="t big" style="top:1180px;font-size:100px">بل قصةُ دولةٍ</div>
    <div id="fStood" class="t big gold" style="top:1300px;font-size:270px">صمدت</div>
    <div id="tag">الجزء الأول · 1979</div>
  </div>
  <div id="leak" class="layer"></div>
  <div id="gflash" class="layer"></div>
  <div id="flash" class="layer"></div>
  <div id="vig" class="layer"></div>
  <canvas id="grain" width="540" height="960"></canvas>
</div>
<script src="lib/gsap.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script type="module" src="reel.js"></script>
</body>
</html>
