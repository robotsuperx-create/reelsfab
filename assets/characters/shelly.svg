<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 787 1400" width="787" height="1400">
  <!-- Shelly — original cartoon turtle, REELS/FAB master design v1. Palette: shell #2A9D8F, belly #FFD166, skin #7BC96F. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF3EF"/>
      <stop offset="1" stop-color="#FFF3D1"/>
    </linearGradient>
    <radialGradient id="shellShade" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3DB5A6"/>
      <stop offset="1" stop-color="#21877B"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#93D886"/>
      <stop offset="1" stop-color="#6BB95F"/>
    </radialGradient>
  </defs>

  <rect width="787" height="1400" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="110" cy="210" r="70" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="690" cy="330" r="46" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="660" cy="1010" r="90" fill="#FFD166" opacity="0.18"/>
  <circle cx="120" cy="960" r="60" fill="#2A9D8F" opacity="0.12"/>

  <!-- ground shadow -->
  <ellipse cx="393" cy="1215" rx="250" ry="34" fill="#1E3A36" opacity="0.14"/>

  <!-- shell (behind the body) -->
  <ellipse cx="393" cy="850" rx="262" ry="318" fill="url(#shellShade)" stroke="#1B6E64" stroke-width="12"/>
  <g fill="#48C0B0" opacity="0.85" stroke="#1B6E64" stroke-width="6">
    <path d="M150 700 l40 -38 l52 8 l14 50 l-36 40 l-52 -6 z"/>
    <path d="M637 700 l-40 -38 l-52 8 l-14 50 l36 40 l52 -6 z"/>
    <path d="M140 900 l42 -30 l48 14 l6 52 l-42 30 l-46 -16 z"/>
    <path d="M647 900 l-42 -30 l-48 14 l-6 52 l42 30 l46 -16 z"/>
  </g>

  <!-- feet -->
  <ellipse cx="300" cy="1168" rx="82" ry="52" fill="url(#skin)" stroke="#4E9443" stroke-width="9"/>
  <ellipse cx="486" cy="1168" rx="82" ry="52" fill="url(#skin)" stroke="#4E9443" stroke-width="9"/>
  <g fill="#4E9443">
    <circle cx="258" cy="1186" r="7"/><circle cx="284" cy="1196" r="7"/><circle cx="312" cy="1198" r="7"/>
    <circle cx="474" cy="1198" r="7"/><circle cx="502" cy="1196" r="7"/><circle cx="528" cy="1186" r="7"/>
  </g>

  <!-- left arm (resting) -->
  <ellipse cx="200" cy="840" rx="48" ry="104" transform="rotate(18 200 840)" fill="url(#skin)" stroke="#4E9443" stroke-width="9"/>
  <!-- right arm (waving) -->
  <ellipse cx="612" cy="650" rx="46" ry="108" transform="rotate(32 612 650)" fill="url(#skin)" stroke="#4E9443" stroke-width="9"/>

  <!-- belly plate -->
  <ellipse cx="393" cy="880" rx="182" ry="246" fill="#FFD166" stroke="#D9A43A" stroke-width="10"/>
  <g stroke="#E3B04B" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M250 760 Q393 790 536 760"/>
    <path d="M226 880 Q393 912 560 880"/>
    <path d="M246 1000 Q393 1030 540 1000"/>
    <path d="M393 650 L393 1120"/>
  </g>

  <!-- neck -->
  <ellipse cx="393" cy="585" rx="96" ry="70" fill="url(#skin)" stroke="#4E9443" stroke-width="9"/>
  <!-- scarf -->
  <path d="M290 600 Q393 660 496 600 L500 640 Q393 700 286 640 Z" fill="#F28C6B" stroke="#C9654A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M458 640 L500 742 L440 708 Z" fill="#F28C6B" stroke="#C9654A" stroke-width="7" stroke-linejoin="round"/>

  <!-- head -->
  <ellipse cx="393" cy="410" rx="188" ry="170" fill="url(#skin)" stroke="#4E9443" stroke-width="10"/>
  <!-- head spots -->
  <circle cx="280" cy="315" r="14" fill="#5FAA53" opacity="0.6"/>
  <circle cx="312" cy="290" r="9" fill="#5FAA53" opacity="0.6"/>
  <circle cx="500" cy="300" r="11" fill="#5FAA53" opacity="0.6"/>

  <!-- flower -->
  <g transform="translate(520 270)">
    <circle cx="0" cy="-26" r="22" fill="#FFD166" stroke="#D9A43A" stroke-width="5"/>
    <circle cx="25" cy="-8" r="22" fill="#FFD166" stroke="#D9A43A" stroke-width="5"/>
    <circle cx="16" cy="22" r="22" fill="#FFD166" stroke="#D9A43A" stroke-width="5"/>
    <circle cx="-16" cy="22" r="22" fill="#FFD166" stroke="#D9A43A" stroke-width="5"/>
    <circle cx="-25" cy="-8" r="22" fill="#FFD166" stroke="#D9A43A" stroke-width="5"/>
    <circle cx="0" cy="0" r="17" fill="#F28C6B" stroke="#C9654A" stroke-width="5"/>
  </g>

  <!-- eyes -->
  <ellipse cx="322" cy="400" rx="52" ry="62" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="7"/>
  <ellipse cx="464" cy="400" rx="52" ry="62" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="7"/>
  <circle cx="332" cy="414" r="29" fill="#2B2B2B"/>
  <circle cx="474" cy="414" r="29" fill="#2B2B2B"/>
  <circle cx="343" cy="400" r="10" fill="#FFFFFF"/>
  <circle cx="485" cy="400" r="10" fill="#FFFFFF"/>
  <circle cx="324" cy="428" r="5" fill="#FFFFFF"/>
  <circle cx="466" cy="428" r="5" fill="#FFFFFF"/>
  <!-- brows -->
  <path d="M282 326 Q318 306 352 320" fill="none" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>
  <path d="M434 320 Q468 306 504 326" fill="none" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="272" cy="478" rx="30" ry="18" fill="#F7A1A1" opacity="0.75"/>
  <ellipse cx="514" cy="478" rx="30" ry="18" fill="#F7A1A1" opacity="0.75"/>

  <!-- smile -->
  <path d="M340 478 Q393 548 446 478 Q393 505 340 478 Z" fill="#E85D75" stroke="#2B2B2B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M372 512 Q393 528 414 512" fill="#FF9EAE" stroke="none"/>
</svg>
